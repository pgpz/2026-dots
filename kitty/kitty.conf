# vim:ft=kitty


scrollback_pager bash -c "exec nvim 63<&0 0</dev/null -u NONE -c 'map <silent> q :qa!<CR>' -c 'set shell=bash scrollback=100000 termguicolors laststatus=0 clipboard+=unnamedplus' -c 'autocmd TermEnter * stopinsert' -c 'autocmd TermClose * call cursor(max([0,INPUT_LINE_NUMBER-1])+CURSOR_LINE, CURSOR_COLUMN)' -c 'terminal sed </dev/fd/63 -e \"s/'$'\x1b'']8;;file:[^\]*[\]//g\" && sleep 0.01 && printf \"'$'\x1b'']2;\"'"

background_opacity 0.64
window_padding_width 8.0000
allow_remote_control yes
enable_audio_bell no
url_style single
tab_bar_style powerline
strip_trailing_spaces always

font_size 9
# font_family family "scientifica"
# bold_font scientifica
# italic_font scientifica
# bold_italic_font scientifica

cursor_trail_start_threshold 2

map kitty_mod+o     next_tab
map kitty_mod+i     previous_tab
map kitty_mod+t     new_tab
map kitty_mod+q     close_tab
map kitty_mod+.     move_tab_forward
map kitty_mod+,     move_tab_backward
map kitty_mod+alt+t set_tab_title
map cmd+shift+c          copy_text
map cmd+shift+v         paste_text
map ctrl+shift+equal change_font_size all +2
map ctrl+shift+plus  change_font_size all +2
map ctrl+shift+kp_add change_font_size all +2

map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+kp_subtract change_font_size all -2.0

map ctrl+shift+backspace change_font_size all 0

map kitty_mod+up        scroll_line_up
map kitty_mod+k         scroll_line_up
map kitty_mod+down      scroll_line_down
map kitty_mod+j         scroll_line_down
map kitty_mod+u 	      scroll_page_up
map kitty_mod+d 	      scroll_page_down
map kitty_mod+home      scroll_home
map kitty_mod+end       scroll_end
map kitty_mod+h         show_scrollback

map ctrl+backspace send_text all \x17

# The basic colors
foreground              #C0CAF5
background              #1A1B26
selection_foreground    #1E1E2E
selection_background    #F5E0DC

# Cursor colors
cursor                  #EAE8FF
cursor_text_color       #D8D5DB
cursor_trail            1
cursor_trail_decay      0.1 0.1

# URL underline color when hovering with mouse
url_color               #1A2328
url_style               curly
detect_urls             yes


# Kitty window border colors
active_border_color     #7F1734
inactive_border_color   #A40000
bell_border_color       #841B2D

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

# Colors for marks (marked text in the terminal)
mark1_foreground #1E1E2E
mark1_background #B4BEFE
mark2_foreground #1E1E2E
mark2_background #CBA6F7
mark3_foreground #1E1E2E
mark3_background #74C7EC

# The 16 terminal colors

# black
color0  #15161E
color8  #F7768E

# red
color1  #F38BA8
color9  #F38BA8

# green
color2  #A6E3A1
color10 #A6E3A1

# yellow
color3  #F9E2AF
color11 #F9E2AF

# blue
color4  #89B4FA
color12 #89B4FA

# magenta
color5  #F5C2E7
color13 #F5C2E7

# cyan
color6  #94E2D5
color14 #94E2D5

# white
color7  #BAC2DE
color15 #A6ADC8


# BEGIN_KITTY_FONTS
font_family      family="PxPlus ToshibaSat 9x16"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
